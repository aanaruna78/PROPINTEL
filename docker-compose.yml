version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: propintel_db
    restart: always
    environment:
      POSTGRES_USER: propintel
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: propintel_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propintel -d propintel_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propintel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
